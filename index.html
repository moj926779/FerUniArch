<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدر و سایت دانشگاه فردوس</title>
    
    <style>
        /* === تنظیمات پایه === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff; 
            font-family: sans-serif;
        }

        /* === هدر اصلی === */
        .header-container {
            width: 100%; 
            background-color: #ffffff; 
            padding: 1.25rem 2rem; 
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            border-radius: 0; 
        }

        /* === استایل لوگو === */
        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            height: clamp(2.5rem, 4vw, 3.5rem);
            width: auto;
            cursor: pointer;
        }

        .brand-logo img, 
        .brand-logo svg {
            height: 100%;
            width: auto;
            display: block;
        }

        /* === استایل منوی همبرگری === */
        .hamburger-menu {
            display: flex;
            flex-direction: column; 
            gap: clamp(0.25rem, 0.4vw, 0.4rem); 
            cursor: pointer;
        }

        .hamburger-line {
            width: clamp(1.5rem, 2.5vw, 2rem); 
            height: clamp(0.2rem, 0.3vw, 0.25rem); 
            background-color: #0d1b4a; 
            border-radius: 2px; 
        }

        /* === استایل محتوا (بنر اول) === */
        .main-content {
            width: 100%;
            padding: 0 2rem;
            margin-top: -0.5rem; 
        }

        .main-content img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0;
        }

        /* === بخش آثار منتخب (تغییرات اصلی اینجاست) === */
        .featured-section {
            width: 100%;
            padding: 0 2rem 0 2rem;
            /* ۱. فاصله از عکس بالایی زیاد بود، آن را کم کردیم */
            margin-top: 1.5rem; 
        }

        .featured-title {
            font-size: clamp(1.5rem, 2.5vw, 2.2rem);
            font-weight: bold;
            color: #0d1b4a;
            /* ۲. فاصله پایین متن تا عکس را خیلی کم کردیم */
            margin-bottom: 0.5rem; 
            padding-right: 0.5rem;
        }

        .featured-image {
            width: 100%;
        }

        .featured-image img {
            width: 100%;
            height: auto;
            display: block;
            /* ۳. گردی گوشه‌های عکس را حذف کردیم */
            border-radius: 0; 
            /* ۴. سایه را هم حذف کردم تا کاملاً تخت شود (دلخواه، می‌توانید برگردانید) */
            box-shadow: none; 
        }

        /* === ریسپانسیو برای موبایل === */
        @media (max-width: 768px) {
            .header-container {
                padding: 1rem 1rem;
            }
            
            .main-content {
                padding: 0 0.5rem;
                margin-top: -0.3rem;
            }

            .featured-section {
                padding: 0 0.5rem 0 0.5rem;
                margin-top: 1.2rem; /* در موبایل فاصله از عکس بالایی کمتر شد */
            }

            .featured-title {
                font-size: 1.3rem;
                margin-bottom: 0.3rem; /* در موبایل فاصله متن و عکس کمتر شد */
                padding-right: 0.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ۱. هدر -->
    <header class="header-container">
        <div class="brand-logo">
            <img src="brand-logo.svg" alt="لوگوی دانشگاه فردوس">
        </div>
        <div class="hamburger-menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </div>
    </header>

    <!-- ۲. محتوای اصلی (بنر اول) -->
    <main class="main-content">
        <img src="ferdows-banner.jpg" alt="آرشیو آنلاین دانشگاه فردوس">
    </main>

    <!-- ۳. بخش جدید: آثار منتخب نمایشی -->
    <section class="featured-section">
        <h2 class="featured-title">آثار منتخب نمایشی</h2>
        <div class="featured-image">
            <img src="stage.jpg" alt="آثار منتخب نمایشی">
        </div>
    </section>

</body>
</html>
