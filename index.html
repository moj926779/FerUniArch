<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدر و سایت دانشگاه فردوس</title>
    
    <style>
        /* === تنظیمات پایه === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff; 
            font-family: sans-serif;
        }

        /* === هدر اصلی === */
        .header-container {
            width: 100%; 
            background-color: #ffffff; 
            padding: 1.25rem 2rem; 
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            border-radius: 0; 
        }

        /* === استایل لوگو === */
        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            height: clamp(2.5rem, 4vw, 3.5rem);
            width: auto;
            cursor: pointer;
        }

        .brand-logo img, 
        .brand-logo svg {
            height: 100%;
            width: auto;
            display: block;
        }

        /* === استایل منوی همبرگری === */
        .hamburger-menu {
            display: flex;
            flex-direction: column; 
            gap: clamp(0.25rem, 0.4vw, 0.4rem); 
            cursor: pointer;
        }

        .hamburger-line {
            width: clamp(1.5rem, 2.5vw, 2rem); 
            height: clamp(0.2rem, 0.3vw, 0.25rem); 
            background-color: #0d1b4a; 
            border-radius: 2px; 
        }

        /* === استایل محتوا (بنر اول) === */
        .main-content {
            width: 100%;
            padding: 0 2rem;
            margin-top: -0.5rem; 
        }

        .main-content img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0;
        }

        /* === بخش آثار منتخب (عکس دوم) === */
        .featured-section {
            width: 100%;
            padding: 0 2rem 0 2rem;
            margin-top: 1.5rem; 
        }

        .featured-title {
            font-size: clamp(1.5rem, 2.5vw, 2.2rem);
            font-weight: bold;
            color: #0d1b4a;
            margin-bottom: 0.5rem; 
            padding-right: 0.5rem;
        }

        .featured-image {
            width: 100%;
        }

        .featured-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0; /* گوشه‌ها تیز */
            box-shadow: none; 
        }

        /* === استایل توضیحات زیر عکس دوم === */
        .image-caption {
            margin-top: 0.8rem; 
            font-size: clamp(1rem, 1.2vw, 1.2rem);
            color: #2c3e50; 
            line-height: 1.6;
            padding-right: 0.5rem; 
        }

        .image-caption .title {
            display: block; 
            font-weight: bold;
            color: #0d1b4a;
            margin-bottom: 0.2rem;
        }

        .image-caption .subtitle {
            font-size: 0.9em; 
            opacity: 0.8; 
        }

        /* === ✅ بخش جدید: عکاسی مفهومی (عکس سوم) === */
        .conceptual-section {
            width: 100%;
            padding: 0 2rem 0 2rem;
            margin-top: 2.5rem; /* فاصله از بخش قبلی */
        }

        .conceptual-title {
            font-size: clamp(1.5rem, 2.5vw, 2.2rem);
            font-weight: bold;
            color: #0d1b4a;
            margin-bottom: 0.5rem; /* فاصله کم با عکس زیرش */
            padding-right: 0.5rem;
        }

        .conceptual-image {
            width: 100%;
        }

        .conceptual-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0; /* تیز */
            box-shadow: none;
        }

        /* === ریسپانسیو برای موبایل === */
        @media (max-width: 768px) {
            .header-container {
                padding: 1rem 1rem;
            }
            
            .main-content {
                padding: 0 0.5rem;
                margin-top: -0.3rem;
            }

            .featured-section {
                padding: 0 0.5rem 0 0.5rem;
                margin-top: 1.2rem;
            }

            .featured-title {
                font-size: 1.3rem;
                margin-bottom: 0.3rem;
                padding-right: 0.2rem;
            }

            .image-caption {
                margin-top: 0.6rem;
                padding-right: 0.2rem;
                font-size: 0.95rem;
            }

            /* ✅ تنظیم بخش جدید در موبایل */
            .conceptual-section {
                padding: 0 0.5rem 0 0.5rem;
                margin-top: 1.8rem;
            }

            .conceptual-title {
                font-size: 1.3rem;
                margin-bottom: 0.3rem;
                padding-right: 0.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ۱. هدر -->
    <header class="header-container">
        <div class="brand-logo">
            <img src="brand-logo.svg" alt="لوگوی دانشگاه فردوس">
        </div>
        <div class="hamburger-menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </div>
    </header>

    <!-- ۲. محتوای اصلی (بنر اول) -->
    <main class="main-content">
        <img src="ferdows-banner.jpg" alt="آرشیو آنلاین دانشگاه فردوس">
    </main>

    <!-- ۳. بخش آثار منتخب (عکس دوم) -->
    <section class="featured-section">
        <h2 class="featured-title">آثار منتخب نمایشی</h2>
        <div class="featured-image">
            <img src="stage.jpg" alt="آثار منتخب نمایشی">
            
            <div class="image-caption">
                <span class="title">ایستگاه رنگارنگ</span>
                <span class="subtitle">نمایشی از دانشجویان رشته سینما - تابستان 1405</span>
            </div>
            
        </div>
    </section>

    <!-- ۴. بخش جدید: عکاسی مفهومی (عکس سوم) -->
    <section class="conceptual-section">
        <h2 class="conceptual-title">عکاسی مفهومی " حافظه مکان"</h2>
        <div class="conceptual-image">
            <img src="memory-place.jpg" alt="عکاسی مفهومی حافظه مکان">
        </div>
    </section>

</body>
</html>
